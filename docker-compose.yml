version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: astra-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai-iot-astra

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: astra-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astra-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
      - mosquitto
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/ai-iot-astra
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - JWT_SECRET=${JWT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - /tmp/aiot-compile:/tmp/aiot-compile

volumes:
  mongo_data:
  mosquitto_data:
  mosquitto_log:
