services:
  # ── Unified Web Service (Backend + Frontend served together) ─────────
  - type: web
    name: aiot-astra
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # The following credentials must be filled in the Render Dashboard:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_REASONING_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: AI_CODE_MODEL
        value: qwen/qwen2.5-coder-32b-instruct
      - key: AI_FAST_MODEL
        value: llama-3.1-8b-instant
