services:
  # ── Backend Web Service ─────────────────────────────────────────────
  - type: web
    name: ai-iot-astra-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        value: https://ai-iot-astra-frontend.onrender.com # Update to your frontend URL once deployed
      # The following credentials must be filled in the Render Dashboard:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_REASONING_MODEL
        value: meta/llama-3.3-70b-instruct
      - key: AI_CODE_MODEL
        value: qwen/qwen2.5-coder-32b-instruct
      - key: AI_FAST_MODEL
        value: llama-3.1-8b-instant

  # ── Frontend Static Site ────────────────────────────────────────────
  - type: web
    name: ai-iot-astra-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishPath: backend/public
    envVars:
      - key: VITE_API_URL
        value: https://ai-iot-astra-backend.onrender.com # Update to your backend Web Service URL
